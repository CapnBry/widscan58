; Widscan58 display: an ESP32 "Cheap Yellow Display" (ESP32-2432S028R,
; ILI9341 320x240 + XPT2046 touch) showing a widscan58 over its UART.
; GPL-3.0-or-later.
;
; Same platform as firmware/ (pioarduino 55.03.312-1 = ESP-IDF 5.5.5).

[platformio]
default_envs = cyd

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
board = esp32dev
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
monitor_speed = 921600
upload_speed = 921600

[env:cyd]

; Built-in simulated widscan58 instead of the UART: for display work without
; a C5 attached.
[env:cyd-sim]
build_flags = -DWS_SIM=1

; LCD bring-up: reads the panel ID and checks writes at each SPI clock by
; reading the frame memory back (results on the console).
[env:cyd-lcdtest]
build_flags = -DWS_LCD_TEST=1
