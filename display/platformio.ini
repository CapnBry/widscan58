; Widscan58 display: an ESP32 display board showing a widscan58 over its
; UART. One section per board, its BOARD_* define picking src/board_*.h:
;   cyd    ESP32 "Cheap Yellow Display" (ESP32-2432S028R): 320x240,
;          ILI9341-style SPI panel, XPT2046 touch
;   cyds3  LCDwiki 3.5" ESP32-S3 display (ES3C35P): 480x320, ST77922 QSPI
;          panel, capacitive touch on I2C
; GPL-3.0-or-later.
;
; Same platform as firmware/ (pioarduino 55.03.312-1 = ESP-IDF 5.5.5).

[platformio]
default_envs = cyd

[cyd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
board = esp32dev
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
monitor_speed = 921600
upload_speed = 921600
build_flags = -DBOARD_CYD=1

[env:cyd]
extends = cyd

; Built-in simulated widscan58 instead of the UART: for display work without
; a C5 attached.
[env:cyd-sim]
extends = cyd
build_flags = ${cyd.build_flags} -DWS_SIM=1

; LCD bring-up: reads the panel ID and checks writes at each SPI clock by
; reading the frame memory back (results on the console).
[env:cyd-lcdtest]
extends = cyd
build_flags = ${cyd.build_flags} -DWS_LCD_TEST=1

[cyds3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
; Native USB Serial/JTAG: it resets into download mode by itself.
board_upload.before_reset = usb-reset
monitor_speed = 921600
upload_speed = 921600
build_flags = -DBOARD_CYDS3=1

[env:cyds3]
extends = cyds3

[env:cyds3-sim]
extends = cyds3
build_flags = ${cyds3.build_flags} -DWS_SIM=1

; Host unit tests for the code without ESP-IDF (RemoteID decoding and
; radio time slices): pio test -e native.
[env:native]
platform = native
build_flags = -std=gnu11 -lm -Isrc
test_build_src = no
